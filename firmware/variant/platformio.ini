; Meshcore_Station_Meteo — L1 Pro. Ne pas hériter de sensor_base : un seul BME680 + GPS.
; FIRMWARE_VERSION doit rester identique à kFirmwareVersion dans StationConfig.h.
; Chargé par extra_configs = variants/*/platformio.ini du dépôt MeshCore.

[env:WioTrackerL1_meteo]
extends = nrf52_base
board = seeed-wio-tracker-l1
board_build.ldscript = boards/nrf52840_s140_v7.ld
build_flags = ${nrf52_base.build_flags}
  -I lib/nrf52/s140_nrf52_7.3.0_API/include
  -I lib/nrf52/s140_nrf52_7.3.0_API/include/nrf52
  -I variants/wio-tracker-l1
  -I examples/simple_sensor
  -I examples/station_meteo
  -D WIO_TRACKER_L1
  -D USE_SX1262
  -D RADIO_CLASS=CustomSX1262
  -D WRAPPER_CLASS=CustomSX1262Wrapper
  -D LORA_TX_POWER=22
  -D LORA_CR=8
  -D SX126X_CURRENT_LIMIT=140
  -D SX126X_RX_BOOSTED_GAIN=1
  -D GPS_BAUD_RATE=9600
  -D GPS_L76K=1
  -D ENV_INCLUDE_GPS=1
  -D ENV_INCLUDE_BME680=1
  -D ENV_PIN_SDA=18
  -D ENV_PIN_SCL=17
  -D DEFAULT_FLOOD_SCOPE_NAME='"fr-42"'
  -D ADVERT_NAME='"F4EED-Meteo"'
  -D ADVERT_LAT=0.0
  -D ADVERT_LON=0.0
  -D ADMIN_PASSWORD='"meteo"'
  -D FIRMWARE_VERSION='"Meshcore_Station_Meteo-0.1.0"'
  -D SENSOR_READ_INTERVAL_SECS=60
build_src_filter = ${nrf52_base.build_src_filter}
  +<../variants/wio-tracker-l1>
  +<helpers/sensors>
  +<../examples/simple_sensor/SensorMesh.cpp>
  +<../examples/simple_sensor/TimeSeriesData.cpp>
  +<../examples/station_meteo>
lib_deps = ${nrf52_base.lib_deps}
  adafruit/Adafruit BME680 Library @ ^2.0.4
  stevemarple/MicroNMEA @ ^2.0.6
